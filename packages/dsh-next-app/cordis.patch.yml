# The dsh-next-app bundle patch: the next-app profile's boot layer over
# dsh-base. Rows here are boot-minimal (ADR-0001): the flag provider and the
# boot glue that spawns the packed Next app as a managed child of the dsh
# host. The unix-socket bridge, the transport rows, and the browser roster
# are the bridge and UI stories' rows - nothing here touches the dsh
# `webserver` carrier, because Next is the only public HTTP surface.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns; these rows carry no config of their own.

- insert:
    # Ordinary provider for the parsed next-app flags (--host, --port). Its
    # plugin-level injection waits for cmdlineArgs; no launcher metadata or
    # special row kind is needed. On --help or a rejected flag nothing is
    # provided, so the runtime row below never starts.
    - id: next-app-cli
      name: "@scope/dsh-next-app/cli"

    # The boot glue: spawns the packed Next app (`next start`) as a managed
    # child through the base layer's subprocess service, detects readiness
    # from the child's stdout, restarts it with backoff on unexpected exit,
    # terminates its process tree on profile stop, and announces the serving
    # URL after the Loader tree settles. Its auth config (auth.user,
    # auth.passwordHash, auth.realm - ADR-0008) is per-deployment and arrives
    # as an id-targeted override of this row in the profile's user patch
    # layer; absent auth means the fence fails closed.
    - id: next-app-runtime
      name: "@scope/dsh-next-app/runtime"
