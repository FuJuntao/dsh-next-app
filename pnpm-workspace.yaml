packages:
  - apps/*
  - packages/*

# Workspace-wide toolchain pins (AC 5 of the scaffold story): members
# reference these via `catalog:` so every package builds with the same
# versions. Latest stable at scaffolding time.
catalog:
  next: 16.3.1
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  vitest: 4.1.10
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@tsconfig/next": 2.0.6
  "@tsconfig/node-ts": 23.6.4
  "@tsconfig/strictest": 2.0.8
