packages:
  - apps/*
  - packages/*
  - e2e

# Workspace-wide toolchain pins: members reference these via `catalog:`
# so every package builds with the same versions.
catalog:
  # The dsh host surface this bundle targets. Cordis resolves a row by its
  # package name from the profile's own tree first, so whatever the bundle
  # drags in wins over the user's dsh installation: the pins track one dsh
  # version (0.1.1-rc.2) in one place, and the profile has to carry each row
  # package together with the rows that talk to it. The tool runtime is where
  # that bites; the bundle patch header carries the mechanism (#138).
  "@deepseek-ai/cordis": 4.0.1
  "@deepseek-ai/schemastery": 3.18.1
  # Deps rather than peers, and paired on purpose: the profile install runs
  # with autoInstallPeers off, and these two must land in the same tree or
  # tool execution crosses module instances (#138). The whole base layer
  # (`@deepseek-ai/dsh-base`) is deliberately NOT pulled in - it drags the
  # native tool packages (node-pty, koffi) whose install scripts pnpm 11
  # blocks by default, and `dsh plugin add` forwards straight to pnpm.
  "@deepseek-ai/dsh-agent-loop": 0.1.1-rc.2
  "@deepseek-ai/dsh-cmdline": 0.1.1-rc.2
  "@deepseek-ai/dsh-host-apiproxy": 0.1.1-rc.2
  "@deepseek-ai/dsh-file-reference": 0.1.1-rc.2
  "@deepseek-ai/dsh-attachment": 0.1.1-rc.2
  # Pinned only so the attachment-defaults drift guard can
  # assert against the values the host actually ships (finding #8).
  "@deepseek-ai/dsh-attachment-local": 0.1.1-rc.2
  "@deepseek-ai/dsh-session": 0.1.1-rc.2
  "@deepseek-ai/dsh-subprocess": 0.1.1-rc.2
  "@deepseek-ai/dsh-tools": 0.1.1-rc.2
  "@deepseek-ai/dsh": 0.1.1-rc.2
  "@base-ui/react": 1.7.0
  "@playwright/test": 1.62.1
  "@remixicon/react": 4.9.0
  lexical: 0.49.0
  "@lexical/react": 0.49.0
  "@tailwindcss/postcss": 4.3.3
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  shadcn: 4.19.0
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  "react-markdown": 10.1.0
  "remark-gfm": 4.0.1
