packages:
  - apps/*
  - packages/*
  - e2e

# Workspace-wide toolchain pins: members reference these via `catalog:`
# so every package builds with the same versions.
catalog:
  # The dsh host surface this bundle targets - the host packages resolve
  # from the user's dsh installation at runtime, so the pins track the
  # tested dsh version (0.1.0-rc.8) in one place.
  "@deepseek-ai/cordis": 4.0.1
  "@deepseek-ai/schemastery": 3.18.1
  "@deepseek-ai/dsh-cmdline": 0.1.0-rc.8
  "@deepseek-ai/dsh-subprocess": 0.1.0-rc.8
  "@deepseek-ai/dsh": 0.1.0-rc.8
  "@playwright/test": 1.62.1
  "@radix-ui/react-icons": 1.3.2
  "@radix-ui/themes": 3.3.0
  "@tailwindcss/postcss": 4.3.3
  tailwindcss: 4.3.3
  next: 16.3.1
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  tsdown: 0.22.14
  oxlint-tsgolint: 7.0.2001
  oxfmt: 0.63.0
  oxlint: 1.78.0
  vitest: 4.1.10
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@tsconfig/next": 2.0.6
  "@tsconfig/node-ts": 23.6.4
  "@tsconfig/node24": 24.0.5
  "@tsconfig/strictest": 2.0.8
